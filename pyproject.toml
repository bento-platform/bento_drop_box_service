[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "bento_drop_box_service"
version = "3.0.0"
description = "Drop box and basic file management service for the Bento platform."
authors = [
    "David Lougheed <david.lougheed@mail.mcgill.ca>", 
    "Simon Chénard <simon.chenard2@mcgill.ca>",
]
readme = "README.md"
packages = [{include = "bento_drop_box_service"}]
repository = "https://github.com/bento-platform/bento_drop_box_service"
license = "LGPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent"
]

[tool.poetry.dependencies]
python = "^3.12.0"
bento-lib = {extras = ["fastapi"], version = "^18.1.4"}
aiofiles = "^25.1.0"
fastapi = {extras = ["all"], version = "^0.162.0"}
werkzeug = "^3.1.5"
python-multipart = "^0.0.32"
pydantic-settings = "^2.11.0"
aiobotocore = "^3.9.2"
orjson = "^3.11.7"

[tool.poetry.group.dev.dependencies]
tox = "^4.31.0"
coverage = "^7.13.3"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.2.0"
debugpy = "^1.8.20"
httpx2 = "^2.3.0"
ruff = "^0.17.2"
moto = {version = "^5.2.4", extras = ["s3", "server"]}

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["PYI041", "RUF022"]
